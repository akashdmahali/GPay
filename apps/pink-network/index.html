<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Case Study</title>
<link rel="icon" type="image/svg+xml" href="../../assets/sun-glyph.svg"/>
<link rel="stylesheet" href="../../assets/colors_and_type.css"/>
<style>
.nav{display:flex;align-items:center;justify-content:space-between;padding:18px 48px;border-bottom:0.5px solid var(--c-straw);background:var(--c-parchment);position:sticky;top:0;z-index:10}
.nav-mark{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:700;font-size:18px;color:var(--c-dusk);text-decoration:none;border-bottom:none}
.nav-mark:hover{border-bottom:none}
.nav-mark img{width:22px;height:22px}
.nav-back{font-family:var(--font-body);font-size:14px;font-weight:500;color:var(--c-bark);text-decoration:none;border-bottom:1px solid transparent}
.nav-back:hover{border-bottom-color:var(--c-bark)}

.wrap{max-width:var(--reading-col);margin:0 auto;padding:0 24px}
.hero{padding:var(--sp-20) 0 var(--sp-8)}
.hero h1{font-size:var(--t-3xl);margin-bottom:var(--sp-3)}
.hero .sub{font-family:var(--font-body);font-size:var(--t-md);color:var(--fg-muted);line-height:var(--lh-lead);max-width:560px}

.meta{display:flex;gap:var(--sp-8);flex-wrap:wrap;padding:var(--sp-8) 0 var(--sp-10);border-bottom:var(--border-default)}
.meta-item{display:flex;flex-direction:column;gap:4px}

.section{padding:var(--sp-10) 0;border-bottom:var(--border-default)}
.section h2{font-size:var(--t-xl);margin-bottom:var(--sp-4)}
.section p{font-size:var(--t-base);color:var(--fg-default);line-height:var(--lh-body)}

.links-section{padding:var(--sp-10) 0;border-bottom:var(--border-default)}
.links-section h2{font-size:var(--t-xl);margin-bottom:var(--sp-6)}
.link-list{display:flex;flex-direction:column;gap:var(--sp-3)}
.link-card{display:flex;align-items:center;gap:var(--sp-4);padding:var(--sp-4) var(--sp-6);background:var(--c-dew);border-radius:var(--r-lg);text-decoration:none;color:var(--c-bark);border-bottom:none;transition:transform var(--dur-fast) var(--ease-out)}
.link-card:hover{transform:translateY(-1px);border-bottom:none}
.link-icon{width:36px;height:36px;border-radius:var(--r-md);background:var(--c-parchment);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.link-icon svg{width:18px;height:18px;stroke:var(--c-dusk)}
.link-label{font-family:var(--font-body);font-size:var(--t-base);font-weight:500;flex:1;color:var(--c-dusk)}
.link-arrow{width:16px;height:16px;stroke:var(--fg-muted);flex-shrink:0}

.embed-section{padding:var(--sp-10) 0 var(--sp-16)}
.embed-section h2{font-size:var(--t-xl);margin-bottom:var(--sp-6)}
.embed-frame{width:100%;height:700px;border-radius:var(--r-xl);overflow:hidden;background:var(--c-dew)}
.embed-frame iframe{width:100%;height:100%;border:none}

.footer{background:var(--c-dusk);color:var(--c-parchment);padding:var(--sp-12) 48px var(--sp-8);margin-top:var(--sp-10)}
.footer-inner{max-width:var(--max-page);margin:0 auto;display:flex;align-items:center;justify-content:space-between;font-size:var(--t-sm)}
.footer a{color:var(--c-parchment);opacity:.8}
.footer a:hover{opacity:1;border-bottom-color:currentColor}

.loading{text-align:center;padding:160px 0;color:var(--fg-muted);font-size:var(--t-sm)}

@media(max-width:640px){
  .nav{padding:16px 24px}
  .footer{padding:var(--sp-10) 24px}
  .hero{padding:var(--sp-16) 0 var(--sp-6)}
  .embed-frame{height:520px}
}
</style>
</head>
<body>

<nav class="nav">
  <a href="../../" class="nav-mark"><img src="../../assets/sun-glyph.svg" alt=""/>Akash Mahali</a>
  <a href="../../#work" class="nav-back">All work</a>
</nav>

<div class="wrap">
  <div id="content">
    <div class="loading">Loading case study…</div>
  </div>
</div>

<footer class="footer">
  <div class="footer-inner">
    <span>© 2026 Akash Mahali</span>
    <a href="https://www.linkedin.com/in/akash-mahali/" target="_blank" rel="noopener">LinkedIn</a>
  </div>
</footer>

<script>
const ICONS={
  prototype:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>',
  slides:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>',
  sheet:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>'
};
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>';

async function load(){
  try{
    const res=await fetch('content.json');
    const d=await res.json();
    const el=document.getElementById('content');
    document.title=d.title+' — Akash Mahali';

    let html=`
      <div class="hero">
        <div class="eyebrow" style="margin-bottom:var(--sp-4)">Case study</div>
        <h1>${d.title}</h1>
        <p class="sub">${d.subtitle}</p>
      </div>
      <div class="meta">
        <div class="meta-item"><span class="eyebrow">Role</span><span>${d.role}</span></div>
        <div class="meta-item"><span class="eyebrow">Timeline</span><span>${d.timeline}</span></div>
      </div>
      <div class="section">
        <h2>Overview</h2>
        <p>${d.overview}</p>
      </div>
    `;

    if(d.sections){
      d.sections.filter(s=>s.body).forEach(s=>{
        html+=`<div class="section"><h2>${s.heading}</h2><p>${s.body}</p></div>`;
      });
    }

    if(d.links&&d.links.length){
      html+=`<div class="links-section"><h2>Resources</h2><div class="link-list">`;
      d.links.forEach(l=>{
        html+=`<a class="link-card" href="${l.url}" target="_blank" rel="noopener">
          <div class="link-icon">${ICONS[l.type]||ICONS.link}</div>
          <div class="link-label">${l.label}</div>
          <span class="link-arrow">${ARROW}</span>
        </a>`;
      });
      html+=`</div></div>`;
    }

    if(d.prototype_embed){
      html+=`<div class="embed-section">
        <h2>Interactive prototype</h2>
        <div class="embed-frame"><iframe src="${d.prototype_embed}" loading="lazy"></iframe></div>
      </div>`;
    }

    el.innerHTML=html;
  }catch(e){
    document.getElementById('content').innerHTML='<div class="loading">Could not load case study.</div>';
  }
}
load();
</script>

</body>
</html>
